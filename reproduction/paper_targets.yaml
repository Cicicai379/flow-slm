paper:
  title: "Flow-SLM: Joint Learning of Linguistic and Acoustic Information for Spoken Language Modeling"
  arxiv: "2508.09350"

training:
  base_data: "parler-tts/mls_eng"
  base_hours: 44659.74
  extended_data:
    - "MLCommons/peoples_speech:clean"
    - "MLCommons/peoples_speech:clean_sa"
  extended_additional_hours: 20000
  epochs: 1
  global_batch_size: 128
  optimizer: AdamW8bit
  future_semantic_tokens: 4
  cfg_dropout: 0.05

inference:
  semantic_top_p: 0.95
  semantic_temperature: 0.8
  gaussian_temperature: 0.8
  cfg_scale: 0.3
  ode_solver: euler
  ode_nfe: 32
  silence_logit_penalty: 10
  mimi_quantizers: 16
  prompt_seconds: 3
  continuation_end_seconds: 10
  continuations_per_prompt: 4
  prompt_count: 500
  prompt_manifest: prompts/test_libri.csv

